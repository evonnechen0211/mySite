<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小熊森林每日英語學苑 - 溫馨一週學習館</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Zen Maru Gothic for warm, cute Japanese/Traditional Chinese typography -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    },
                    colors: {
                        wood: {
                            50: '#fcfbfa',
                            100: '#f5f0eb',
                            200: '#e8ded4',
                            300: '#d4c2b2',
                            600: '#8c6d53',
                            700: '#6e533d',
                            800: '#523c2a',
                            900: '#382619',
                        },
                        cream: '#fffdf9',
                        warmGreen: '#829373',
                        softYellow: '#f4ebd0',
                        terracotta: '#c97a5f'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f0eb;
            color: #523c2a;
            font-family: 'Zen Maru Gothic', sans-serif;
        }
        .wood-card {
            background-color: #fffdf9;
            border: 2px solid #e8ded4;
            box-shadow: 0 10px 25px -5px rgba(140, 109, 83, 0.08), 0 8px 10px -6px rgba(140, 109, 83, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f5f0eb;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4c2b2;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-warmGreen selection:text-white">

    <header class="w-full bg-[#fffdf9] border-b border-[#e8ded4] sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-wood-600 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-wood-800 tracking-wide">小熊森林英文館</h1>
                    <p class="text-xs text-wood-600">Daily English Weekly Interactive Hub</p>
                </div>
            </div>

            <!-- Settings / API Key Toggle -->
            <div class="flex items-center space-x-2">
                <button onclick="openSettingsModal()" class="flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-wood-100 hover:bg-wood-200 text-wood-800 transition text-sm font-medium border border-wood-200">
                    <i class="fa-solid fa-key text-terracotta"></i>
                    <span>API 設定與語音</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Sidebar: Week Days Navigator -->
        <div class="lg:col-span-1 flex flex-col space-y-3">
            <div class="wood-card rounded-2xl p-4">
                <h2 class="text-base font-bold text-wood-800 mb-3 flex items-center">
                    <i class="fa-solid fa-calendar-days text-warmGreen mr-2"></i> 一週學習進度
                </h2>
                <div id="day-list" class="space-y-2">
                    <!-- Dynamic Day Buttons generated by JS -->
                </div>
            </div>

            <!-- Quick AI Teacher Card -->
            <div class="wood-card rounded-2xl p-4 bg-gradient-to-br from-amber-50 to-orange-50 border-amber-200">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-8 h-8 rounded-full bg-amber-200 flex items-center justify-center text-wood-800">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h3 class="font-bold text-wood-800 text-sm">森林 AI 小導師</h3>
                </div>
                <p class="text-xs text-wood-600 mb-3">輸入您的 Gemini API Key 後，可隨時向 AI 提問任何單字、文法或要求造句！</p>
                <button onclick="openAiChat()" class="w-full py-2 bg-wood-700 hover:bg-wood-800 text-white rounded-xl text-xs font-bold transition shadow-sm flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-comments"></i>
                    <span>開啟 AI 互動聊天室</span>
                </button>
            </div>
        </div>

        <!-- Main Content Panel: Daily Expression Details -->
        <div class="lg:col-span-3 flex flex-col space-y-6">
            <div id="lesson-container" class="wood-card rounded-3xl p-6 sm:p-8 relative overflow-hidden">
                <!-- Lesson content populated dynamically -->
                <div class="flex justify-center items-center py-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-wood-600"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="wood-card bg-cream rounded-3xl max-w-md w-full p-6 shadow-2xl border border-wood-200 relative animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-wood-800 flex items-center">
                    <i class="fa-solid fa-gear text-warmGreen mr-2"></i> 設定與人聲選項
                </h3>
                <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-wood-100 hover:bg-wood-200 text-wood-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-wood-700 mb-1">Gemini API Key (選填)</label>
                    <input type="password" id="api-key-input" placeholder="AI-zaSy..." class="w-full px-3.5 py-2.5 rounded-xl border border-wood-200 bg-wood-50 text-wood-800 text-sm focus:outline-none focus:ring-2 focus:ring-wood-600">
                    <p class="text-[11px] text-wood-600 mt-1">若使用預設環境可不填。填入後可啟用 AI 發音與互動對話功能。</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-wood-700 mb-1">TTS 語音選擇 (Gemini TTS Voices)</label>
                    <select id="voice-select" class="w-full px-3.5 py-2.5 rounded-xl border border-wood-200 bg-wood-50 text-wood-800 text-sm focus:outline-none focus:ring-2 focus:ring-wood-600">
                        <option value="Zephyr">Zephyr (明亮活潑)</option>
                        <option value="Puck">Puck (輕快朝氣)</option>
                        <option value="Kore">Kore (溫柔堅定)</option>
                        <option value="Fenrir">Fenrir (充滿活力)</option>
                        <option value="Aoede">Aoede (微風輕柔)</option>
                        <option value="Charon">Charon (沉穩清晰)</option>
                    </select>
                </div>

                <div class="pt-2 flex space-x-3">
                    <button onclick="saveSettings()" class="flex-1 py-2.5 bg-wood-700 hover:bg-wood-800 text-white rounded-xl text-sm font-bold transition shadow-sm">
                        儲存設定
                    </button>
                    <button onclick="closeSettingsModal()" class="px-4 py-2.5 bg-wood-100 hover:bg-wood-200 text-wood-800 rounded-xl text-sm font-medium transition">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="wood-card bg-cream rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-wood-200 flex flex-col h-[550px]">
            <div class="flex justify-between items-center pb-3 border-b border-wood-200">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-wood-600 text-white flex items-center justify-center text-sm">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-wood-800 text-sm">森林 AI 英文小幫手</h3>
                        <p class="text-[10px] text-wood-600">隨時問我英文問題！</p>
                    </div>
                </div>
                <button onclick="closeAiChat()" class="w-8 h-8 rounded-full bg-wood-100 hover:bg-wood-200 text-wood-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Chat Messages Area -->
            <div id="chat-messages" class="flex-grow overflow-y-auto custom-scrollbar p-3 space-y-3 my-3">
                <div class="flex items-start space-x-2">
                    <div class="w-7 h-7 rounded-full bg-wood-600 text-white flex-shrink-0 flex items-center justify-center text-xs">AI</div>
                    <div class="bg-wood-100 rounded-2xl p-3 text-xs text-wood-800 max-w-[80%] leading-relaxed">
                        Hello! 歡迎來到每日英文聊天室。你可以問我關於今天片語的造句、文法差異，或是讓我和你進行對話練習喔！
                    </div>
                </div>
            </div>

            <!-- Chat Input Area -->
            <div class="flex items-center space-x-2 pt-2 border-t border-wood-200">
                <input type="text" id="chat-input" placeholder="輸入你想問英文的問題..." class="flex-grow px-3.5 py-2.5 rounded-xl border border-wood-200 bg-wood-50 text-wood-800 text-xs focus:outline-none focus:ring-2 focus:ring-wood-600" onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" class="px-4 py-2.5 bg-wood-700 hover:bg-wood-800 text-white rounded-xl text-xs font-bold transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <footer class="w-full bg-[#fffdf9] border-t border-[#e8ded4] py-4 text-center text-xs text-wood-600">
        <p>小熊森林每日英語學苑 • 溫馨陪伴你的每一天 🌿</p>
    </footer>

    <script>
        // Weekly Data Store
        const weeklyData = [
            {
                day: "週一 (Monday)",
                phrase: "Bite the bullet",
                meaning: "To force yourself to do a difficult or unpleasant thing that you have been avoiding.",
                zhMeaning: "硬著頭皮做；咬緊牙關面對難關。",
                context: "Professional & Daily",
                examples: [
                    {
                        en: "I hate doing my taxes, but I need to bite the bullet and finish them by tonight.",
                        zh: "我討厭報稅，但我今晚必須咬緊牙關把它們做完。"
                    },
                    {
                        en: "Let's just bite the bullet and complete the software update right now.",
                        zh: "我們乾脆硬著頭皮把軟體更新做完吧。"
                    }
                ],
                tip: "注意 bite 和 the 之間的連音，不用刻意停頓。",
                pronunciation: "/baɪt ðə ˈbʊlɪt/",
                challenge: {
                    question: "When facing a difficult task, you shouldn't run away; instead, you must ______ the bullet.",
                    answer: "bite",
                    options: ["chew", "bite", "swallow"],
                    correctIndex: 1
                }
            },
            {
                day: "週二 (Tuesday)",
                phrase: "Hit the nail on the head",
                meaning: "To describe exactly what is causing a situation or problem; to be precisely right.",
                zhMeaning: "一針見血；說得完全正確；命中要害。",
                context: "Workplace & Discussion",
                examples: [
                    {
                        en: "When Sarah said our marketing strategy lacked focus, she really hit the nail on the head.",
                        zh: "當莎拉說我們的行銷策略缺乏焦點時，她真的說得一針見血。"
                    },
                    {
                        en: "You hit the nail on the head—that's why I decided to change my career path.",
                        zh: "你說得完全正確——這就是為什麼我決定改變職涯跑道的原因。"
                    }
                ],
                tip: "常用於讚許對方觀察敏銳，切中核心。",
                pronunciation: "/hɪt ðə neɪl ɒn ðə hɛd/",
                challenge: {
                    question: "What does it mean when someone hits the nail on the head?",
                    answer: "They make an accurate observation.",
                    options: ["They fix furniture", "They make an accurate observation", "They miss the point"],
                    correctIndex: 1
                }
            },
            {
                day: "週三 (Wednesday)",
                phrase: "A blessing in disguise",
                meaning: "Something that seems bad or unlucky at first, but results in something good happening later.",
                zhMeaning: "塞翁失馬，焉知非福；表面是壞事、結局是好事。",
                context: "Life & Reflection",
                examples: [
                    {
                        en: "Missing my flight was a blessing in disguise because I met my future business partner at the airport lounge.",
                        zh: "錯過班機其實是塞翁失馬，因為我在貴賓室遇到了我未來的商業夥伴。"
                    },
                    {
                        en: "Losing that job turned out to be a blessing in disguise.",
                        zh: "失去那份工作結果反而是個福氣。"
                    }
                ],
                tip: "disguise 發音為 /dɪsˈɡaɪz/，意指偽裝或掩飾。",
                pronunciation: "/ə ˈblɛsɪŋ ɪn dɪsˈɡaɪz/",
                challenge: {
                    question: "A blessing in disguise is best described as:",
                    answer: "A good thing that seemed bad at first.",
                    options: ["A hidden treasure", "A good thing that seemed bad at first", "A costly mistake"],
                    correctIndex: 1
                }
            },
            {
                day: "週四 (Thursday)",
                phrase: "Call it a day",
                meaning: "To stop working on something; to decide that you have finished for the day.",
                zhMeaning: "今天到此結束；收工！",
                context: "Work & Daily Routine",
                examples: [
                    {
                        en: "We've been working on this report for six hours. Let's call it a day.",
                        zh: "我們這份報告已經寫了六個小時了。今天就到這裡吧！"
                    },
                    {
                        en: "It's already 10 PM. Time to call it a day.",
                        zh: "已經晚上十點了，該收工休息了。"
                    }
                ],
                tip: "職場與日常生活中非常道地的實用慣用語。",
                pronunciation: "/kɔːl ɪt ə deɪ/",
                challenge: {
                    question: "If your boss says 'Let's call it a day', what does it mean?",
                    answer: "Stop working and go home/rest.",
                    options: ["Start a new workday", "Stop working and go home/rest", "Call someone on the phone"],
                    correctIndex: 1
                }
            },
            {
                day: "週五 (Friday)",
                phrase: "Piece of cake",
                meaning: "Something very easy to do.",
                zhMeaning: "輕而易舉的事；小菜一碟。",
                context: "Casual & Confidence",
                examples: [
                    {
                        en: "Don't worry about the English test tomorrow; it'll be a piece of cake.",
                        zh: "不用擔心明天的英文考試，那簡直是小菜一碟。"
                    },
                    {
                        en: "Fixing this bicycle tire is a piece of cake for me.",
                        zh: "修補這個腳踏車輪胎對我來說輕而易舉。"
                    }
                ],
                tip: "用來形容事情非常簡單好上手。",
                pronunciation: "/piːs ɒv keɪk/",
                challenge: {
                    question: "If a task is a 'piece of cake', it is:",
                    answer: "Very easy.",
                    options: ["Very delicious", "Very difficult", "Very easy"],
                    correctIndex: 2
                }
            },
            {
                day: "週六 (Saturday)",
                phrase: "Under the weather",
                meaning: "Feeling slightly ill, sick, or low energy.",
                zhMeaning: "身體有點不舒服；微恙。",
                context: "Health & Well-being",
                examples: [
                    {
                        en: "I'm feeling a bit under the weather today, so I think I'll stay home and rest.",
                        zh: "我今天感覺身體有點不舒服，所以我想待在家裡休息。"
                    },
                    {
                        en: "John didn't come to the party because he was under the weather.",
                        zh: "約翰沒有來派對，因為他身體有點不舒服。"
                    }
                ],
                tip: "常用於形容輕微感冒或精神不濟。",
                pronunciation: "/ˈʌndər ðə ˈwɛðər/",
                challenge: {
                    question: "If you are 'under the weather', you are:",
                    answer: "Feeling slightly sick.",
                    options: ["Stuck in the rain", "Feeling slightly sick", "Happy with the weather"],
                    correctIndex: 1
                }
            },
            {
                day: "週日 (Sunday)",
                phrase: "Burn the midnight oil",
                meaning: "To work or study late into the night.",
                zhMeaning: "熬夜苦讀；挑燈夜戰。",
                context: "Study & Dedication",
                examples: [
                    {
                        en: "She has an exam tomorrow, so she's burning the midnight oil tonight.",
                        zh: "她明天有考試，所以今晚在挑燈夜戰。"
                    },
                    {
                        en: "We had to burn the midnight oil to meet the project deadline.",
                        zh: "為了趕上專案死線，我們不得不熬夜加班。"
                    }
                ],
                tip: "源自過去使用油燈照明熬夜的時代。",
                pronunciation: "/bɜːn ðə ˈmɪdnaɪt ɔɪl/",
                challenge: {
                    question: "What does 'burning the midnight oil' mean?",
                    answer: "Working or studying late into the night.",
                    options: ["Lighting a candle", "Working or studying late into the night", "Wasting fuel"],
                    correctIndex: 1
                }
            }
        ];

        let currentDayIndex = 0;
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let selectedVoice = localStorage.getItem('gemini_tts_voice') || 'Zephyr';

        // Initialization on load
        window.onload = function() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('voice-select').value = selectedVoice;
            renderDayList();
            loadLesson(0);
        };

        // Render Day list in sidebar
        function renderDayList() {
            const container = document.getElementById('day-list');
            container.innerHTML = '';
            weeklyData.forEach((item, index) => {
                const btn = document.createElement('button');
                const isActive = index === currentDayIndex;
                btn.className = `w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between ${isActive ? 'bg-wood-700 text-white shadow-sm' : 'bg-wood-50 text-wood-700 hover:bg-wood-100'}`;
                btn.innerHTML = `
                    <span>${item.day}</span>
                    <span class="${isActive ? 'text-amber-200' : 'text-wood-600'} font-normal text-[11px] truncate max-w-[120px]">${item.phrase}</span>
                `;
                btn.onclick = () => loadLesson(index);
                container.appendChild(btn);
            });
        }

        // Load specific lesson
        function loadLesson(index) {
            currentDayIndex = index;
            renderDayList();
            const data = weeklyData[index];
            const container = document.getElementById('lesson-container');

            container.innerHTML = `
                <div class="flex flex-wrap justify-between items-start gap-4 mb-6 pb-4 border-b border-wood-200">
                    <div>
                        <span class="inline-block px-3 py-1 rounded-full bg-wood-100 text-wood-800 text-xs font-bold mb-2">
                            <i class="fa-solid fa-calendar-day mr-1 text-warmGreen"></i> ${data.day}
                        </span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-wood-900 tracking-tight flex items-center flex-wrap gap-2">
                            "${data.phrase}"
                            <button onclick="playTtsAudio('${data.phrase}')" title="播放真人/AI語音" class="w-9 h-9 rounded-full bg-warmGreen text-white text-sm hover:bg-opacity-90 transition flex items-center justify-center shadow-sm">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </h2>
                        <p class="text-xs text-wood-600 mt-1">Pronunciation: <span class="font-mono text-terracotta">${data.pronunciation}</span></p>
                    </div>
                    <div class="px-3 py-1.5 rounded-xl bg-orange-100 text-terracotta text-xs font-medium">
                        <i class="fa-solid fa-tag mr-1"></i> ${data.context}
                    </div>
                </div>

                <div class="space-y-6">
                    <!-- Meaning Section -->
                    <div class="p-4 rounded-2xl bg-wood-50 border border-wood-200">
                        <h3 class="text-xs font-bold text-wood-600 uppercase tracking-wider mb-2">意義解析 (Meaning & Translation)</h3>
                        <p class="text-sm text-wood-800 font-medium leading-relaxed mb-1">${data.meaning}</p>
                        <p class="text-sm text-terracotta font-bold">中文含意：${data.zhMeaning}</p>
                    </div>

                    <!-- Examples Section -->
                    <div>
                        <h3 class="text-xs font-bold text-wood-600 uppercase tracking-wider mb-3">生活與職場例句 (Example Sentences)</h3>
                        <div class="space-y-3">
                            ${data.examples.map((ex, i) => `
                                <div class="p-4 rounded-2xl bg-cream border border-wood-200 space-y-1.5">
                                    <div class="flex items-start justify-between gap-2">
                                        <p class="text-sm font-semibold text-wood-900">
                                            <span class="text-xs px-2 py-0.5 rounded bg-wood-200 text-wood-800 mr-1.5 font-normal">例 ${i+1}</span>
                                            ${ex.en}
                                        </p>
                                        <button onclick="playTtsAudio('${ex.en.replace(/'/g, "\\'")}')" class="text-wood-600 hover:text-wood-800 text-xs p-1" title="朗讀句子">
                                            <i class="fa-solid fa-volume-high"></i>
                                        </button>
                                    </div>
                                    <p class="text-xs text-wood-600 pl-7">(${ex.zh})</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Pronunciation Tip -->
                    <div class="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-200 flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-full bg-emerald-200 text-emerald-800 flex-shrink-0 flex items-center justify-center text-xs mt-0.5">
                            <i class="fa-solid fa-microphone-lines"></i>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-emerald-900 mb-1">發音小技巧 (Pronunciation Tip)</h3>
                            <p class="text-xs text-emerald-800 leading-relaxed">${data.tip}</p>
                        </div>
                    </div>

                    <!-- Interactive Challenge -->
                    <div class="p-5 rounded-2xl bg-amber-50/80 border border-amber-200 space-y-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-amber-200 text-wood-800 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-puzzle-piece"></i>
                            </div>
                            <h3 class="text-xs font-bold text-wood-800 uppercase tracking-wider">今日互動小挑戰 (Challenge)</h3>
                        </div>
                        <p class="text-sm font-medium text-wood-900">${data.challenge.question}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1" id="challenge-options">
                            ${data.challenge.options.map((opt, optIdx) => `
                                <button onclick="checkAnswer(${index}, ${optIdx})" class="px-3 py-2 rounded-xl bg-white hover:bg-amber-100 border border-amber-200 text-xs text-wood-800 font-medium transition text-center shadow-sm">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                        <div id="challenge-feedback-${index}" class="text-xs font-bold pt-1 hidden"></div>
                    </div>
                </div>
            `;
        }

        // Check Answer function
        function checkAnswer(lessonIdx, chosenIdx) {
            const data = weeklyData[lessonIdx];
            const feedbackEl = document.getElementById(`challenge-feedback-${lessonIdx}`);
            feedbackEl.classList.remove('hidden');
            if (chosenIdx === data.challenge.correctIndex) {
                feedbackEl.className = "text-xs font-bold pt-1 text-emerald-700";
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> 太棒了！答對囉！這是正確的選項。`;
            } else {
                feedbackEl.className = "text-xs font-bold pt-1 text-terracotta";
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> 答錯囉！再想看看或是複習一下上面的解釋喔。`;
            }
        }

        // Settings Modal Handlers
        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }
        function saveSettings() {
            apiKey = document.getElementById('api-key-input').value.trim();
            selectedVoice = document.getElementById('voice-select').value;
            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('gemini_tts_voice', selectedVoice);
            closeSettingsModal();
            alert("設定已成功儲存！");
        }

        // AI Chat Modal Handlers
        function openAiChat() {
            document.getElementById('chat-modal').classList.remove('hidden');
        }
        function closeAiChat() {
            document.getElementById('chat-modal').classList.add('hidden');
        }

        // TTS Audio Playback using Gemini TTS or Web Speech Fallback
        async function playTtsAudio(textToSpeak) {
            const currentApiKey = document.getElementById('api-key-input').value.trim() || apiKey;
            
            // If API key is provided, try Gemini TTS API
            if (currentApiKey) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${currentApiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: `Say clearly and naturally in English: ${textToSpeak}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: selectedVoice }
                                }
                            }
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/")) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        const audio = new Audio(audioUrl);
                        audio.play();
                        return;
                    }
                } catch (e) {
                    console.log("Gemini TTS fallback to browser speech due to network or key limit", e);
                }
            }

            // Browser Web Speech API Fallback
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("瀏覽器不支援語音播放功能，請檢查 API Key 設定。");
            }
        }

        // Helper: base64 to ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Helper: PCM to WAV container
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcm16.length * 2;
            const chunkSize = 36 + dataSize;

            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            // RIFF header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');
            // fmt sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // SubChunk1Size (16 for PCM)
            view.setUint16(20, 1, true);  // AudioFormat (1 for PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            // data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // AI Chat Messaging with Gemini API
        async function sendChatMessage() {
            const inputEl = document.getElementById('chat-input');
            const messageText = inputEl.value.trim();
            if (!messageText) return;

            const currentApiKey = document.getElementById('api-key-input').value.trim() || apiKey;
            const chatMessages = document.getElementById('chat-messages');

            // Append User message
            chatMessages.innerHTML += `
                <div class="flex items-start justify-end space-x-2">
                    <div class="bg-wood-700 text-white rounded-2xl p-3 text-xs max-w-[80%] leading-relaxed shadow-sm">
                        ${escapeHtml(messageText)}
                    </div>
                    <div class="w-7 h-7 rounded-full bg-wood-200 text-wood-800 flex-shrink-0 flex items-center justify-center text-xs font-bold">你</div>
                </div>
            `;
            inputEl.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Loading indicator
            const loadingId = 'loading-' + Date.now();
            chatMessages.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-2">
                    <div class="w-7 h-7 rounded-full bg-wood-600 text-white flex-shrink-0 flex items-center justify-center text-xs">AI</div>
                    <div class="bg-wood-100 rounded-2xl p-3 text-xs text-wood-600 animate-pulse">
                        森林小幫手正在思考中...
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (!currentApiKey) {
                setTimeout(() => {
                    document.getElementById(loadingId).remove();
                    chatMessages.innerHTML += `
                        <div class="flex items-start space-x-2">
                            <div class="w-7 h-7 rounded-full bg-wood-600 text-white flex-shrink-0 flex items-center justify-center text-xs">AI</div>
                            <div class="bg-wood-100 rounded-2xl p-3 text-xs text-wood-800 max-w-[80%] leading-relaxed">
                                您尚未設定 Gemini API Key！請點擊右上角「API 設定與語音」填入您的 Key，即可解鎖完整的 AI 互動問答功能喔！
                            </div>
                        </div>
                    `;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 800);
                return;
            }

            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${currentApiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: messageText }] }],
                    systemInstruction: {
                        parts: [{ text: "You are a friendly, cute forest English teacher. Help users learn English idioms, explain grammar simply, and encourage them warmly in Traditional Chinese." }]
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                document.getElementById(loadingId).remove();

                const candidate = result.candidates?.[0];
                const replyText = candidate?.content?.parts?.[0]?.text || "抱歉，森林信號不佳，請稍後再試一次！";

                chatMessages.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-7 h-7 rounded-full bg-wood-600 text-white flex-shrink-0 flex items-center justify-center text-xs">AI</div>
                        <div class="bg-wood-100 rounded-2xl p-3 text-xs text-wood-800 max-w-[80%] leading-relaxed whitespace-pre-line">
                            ${escapeHtml(replyText)}
                        </div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (err) {
                document.getElementById(loadingId).remove();
                chatMessages.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-7 h-7 rounded-full bg-wood-600 text-white flex-shrink-0 flex items-center justify-center text-xs">AI</div>
                        <div class="bg-wood-100 rounded-2xl p-3 text-xs text-terracotta max-w-[80%] leading-relaxed">
                            連線發生錯誤，請檢查您的 API Key 是否正確。
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
